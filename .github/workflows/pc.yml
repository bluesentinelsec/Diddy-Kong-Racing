name: PC build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            artifact: dkracing-linux-x86_64
          - name: Linux arm64
            os: ubuntu-24.04-arm
            artifact: dkracing-linux-arm64
          - name: macOS arm64
            os: macos-15
            artifact: dkracing-macos-arm64
          - name: Windows x86_64 (MinGW)
            os: windows-latest
            artifact: dkracing-windows-x86_64
    defaults:
      run:
        shell: ${{ startsWith(matrix.os, 'windows') && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libxtst-dev libxinerama-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libegl-dev libgl-dev libdrm-dev libgbm-dev libibus-1.0-dev

      - name: Install build dependencies (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            git

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDKR_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Check the binary is self-contained
        run: |
          ls -la build/dkracing* 
          if command -v ldd >/dev/null; then ldd build/dkracing* | grep -i sdl && exit 1 || true; fi
          if command -v otool >/dev/null; then otool -L build/dkracing | grep -i sdl && exit 1 || true; fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/dkracing*

  web:
    name: Web (Emscripten)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The same Docker image and make target developers use. CI has no game
      # data, so the page is built without assets: this checks the code
      # compiles and links for wasm, not that the game runs.
      - name: Build
        run: make web

      - name: Upload page
        uses: actions/upload-artifact@v4
        with:
          name: dkracing-web
          path: |
            build/web/dkracing.html
            build/web/dkracing.js
            build/web/dkracing.wasm

  ios:
    name: iOS arm64 (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The same CMake + Xcode path as `make ios`. No signing identity on a
      # runner and no game data, so this checks the game and SDL compile and
      # link for iOS and produce the app bundle, not that it is playable.
      - name: Build
        run: make ios

      - name: Check the bundle carries the game
        run: |
          app="build/ios/Release-iphoneos/Diddy Kong Racing.app"
          ls -la "$app"
          file "$app/Diddy Kong Racing" | grep -q arm64
          plutil -p "$app/Info.plist" | grep -q LandscapeLeft

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: dkracing-ios-arm64-unsigned
          path: build/ios/Release-iphoneos/Diddy Kong Racing.app
